version: '3.8'

services:
  # Benefit Application
  benefit:
    build:
      context: ./benefit
      dockerfile: Dockerfile
    container_name: benefit-app
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - benefit-network

  # Financial Application
  financial:
    build:
      context: ./financial/TimorINSS-MInterno
      dockerfile: Dockerfile
    container_name: financial-app
    ports:
      - "8082:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - benefit-network

networks:
  benefit-network:
    driver: bridge

