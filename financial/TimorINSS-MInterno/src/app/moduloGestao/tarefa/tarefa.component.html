<div class="gestaoTarefas">

  <div class="subHeader">
    <div class="searchContainer">
      <button class="tarefaSearchButton" mat-fab color="green" aria-label="Search" (click)="pesquisarTarefa()">
        <mat-icon class="tarefaSearchIcon">search</mat-icon>
      </button>
      <mat-form-field class="pesquisar" appearance="outline">
        <mat-label>{{'general.pesquisar' | translate}}</mat-label>
        <input matInput maxlength="100" type="text" [(ngModel)]="filterBy" name="stringFilterInput" (keydown.enter)="pesquisarTarefa()" />
        <fa-icon *ngIf="filterBy" matSuffix aria-label="Clear" [icon]="faTimesCircle" (click)="clearPesquisarTarefa()">
        </fa-icon>
      </mat-form-field>
    </div>
  </div>

  <div>
    <div class="configurarTarefa">
      <button class="configurarTarefaButton" mat-raised-button (click)="configurarTarefa()" [disabled]="!create">
        <mat-icon>build</mat-icon>
        <mat-label>{{'tarefa.configurarTarefa' | translate}}</mat-label>
      </button>
    </div>

    <div class="painelListagemTarefas">

      <div class="tabelaTarefaTitulo">
        <mat-icon class="tableTitleIcon">task_alt</mat-icon>
        {{'tarefa.title' | translate}}
      </div>

      <table mat-table [dataSource]="dataSourceTarefa" class="mat-elevation-z8 tabelaTarefa">
        <ng-container matColumnDef="numero">
          <th mat-header-cell *matHeaderCellDef> {{'tarefa.numero' | translate}} </th>
          <td mat-cell *matCellDef="let element"> {{element.numero}} </td>
        </ng-container>
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef> {{'tarefa.nome' | translate}} </th>
          <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
        </ng-container>
        <ng-container matColumnDef="acoes">
          <th mat-header-cell *matHeaderCellDef> {{'general.Editar' | translate}} </th>
          <td mat-cell *matCellDef="let element">
            <mat-icon *ngIf="update" class="editIconTable" (click)="editarTarefa(element.id, element.nome)">edit</mat-icon>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumnsTarefa"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumnsTarefa;"></tr>
      </table>
      <mat-paginator class="paginator" [length]="this.totalRowsTarefaTable" [pageSize]="this.pageSizeTarefaTable"
        (page)="updateTarefaTable($event)" [pageIndex]="pageIndexTarefaTable"
        [pageSizeOptions]="[5,10,25,50,100,500,1000]" showFirstLastButtons>
      </mat-paginator>

    </div>
  </div>
</div>
