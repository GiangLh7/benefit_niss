<div class="gestaoProcessos">

    <div class="subHeader">
        <div class="searchContainer">
            <button class="processoSearchButton" mat-fab color="green" aria-label="Search"
                (click)="pesquisarProcesso()">
                <mat-icon class="processoSearchIcon">search</mat-icon>
            </button>
            <mat-form-field class="pesquisar" appearance="outline">
                <mat-label>{{'general.pesquisar' | translate}}</mat-label>
                <input matInput maxlength="100" type="text" [(ngModel)]="filterBy" (keydown.enter)="pesquisarProcesso()" name="stringFilterInput" />
                <fa-icon *ngIf="filterBy" matSuffix aria-label="Clear" [icon]="faTimesCircle"
                    (click)="clearPesquisarProcesso()">
                </fa-icon>
            </mat-form-field>
        </div>
    </div>

    <div>
        <div class="configurarProcesso">
            <button class="configurarProcessoButton" mat-raised-button (click)="configurarProcesso()"
                [disabled]="!create">
                <mat-icon>build</mat-icon>
                <mat-label>{{'processo.configurarProcesso' | translate}}</mat-label>
            </button>
        </div>

        <div class="painelListagemProcessos">

            <div class="tabelaProcessoTitulo">
                <mat-icon class="tableTitleIcon">playlist_add_check</mat-icon>
                {{'processo.title' | translate}}
            </div>

            <table mat-table [dataSource]="processosList" class="mat-elevation-z8 tabelaProcesso">
                <ng-container matColumnDef="data">
                    <th mat-header-cell *matHeaderCellDef> {{'processo.data' | translate}} </th>
                    <td mat-cell *matCellDef="let element"> {{formatDatePT(element.data)}} </td>
                </ng-container>
                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef> {{'processo.nome' | translate}} </th>
                    <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
                </ng-container>
                <ng-container matColumnDef="acoes">
                    <th mat-header-cell *matHeaderCellDef> {{'processo.actions' | translate}} </th>
                    <td mat-cell *matCellDef="let element">
                        <mat-icon *ngIf="update" class="editIconTable"
                            (click)="editarProcesso(element.id)">edit</mat-icon>
                        <mat-icon *ngIf="element.indAtivo" class="swithActive" (click)="updateProcesso(element)"
                            matTooltip="{{'processo.inativarProcesso' | translate}}">toggle_on
                        </mat-icon>
                        <mat-icon *ngIf="!element.indAtivo" class="swithInactive" (click)="updateProcesso(element)"
                            matTooltip="{{'processo.ativarProcessp' | translate}}">toggle_off
                        </mat-icon>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumnsProcesso"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumnsProcesso;"></tr>
            </table>
            <mat-paginator class="paginator" [length]="this.totalRowsProcessoTable"
                [pageSize]="this.pageSizeProcessoTable" (page)="updateProcessoTable($event)"
                [pageIndex]="pageIndexProcessoTable" [pageSizeOptions]="[5,10,25,50,100,500,1000]" showFirstLastButtons>
            </mat-paginator>

        </div>
    </div>
</div>
