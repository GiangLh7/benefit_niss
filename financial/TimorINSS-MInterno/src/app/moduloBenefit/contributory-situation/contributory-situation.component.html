<div class="contributory-situation-container">
  <div *ngIf="isLoading" class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!isLoading" class="table-wrapper">
    <table mat-table [dataSource]="summaryData" class="summary-table">
      <!-- Metric Column -->
      <ng-container matColumnDef="metric">
        <th mat-header-cell *matHeaderCellDef>Summary Metric</th>
        <td mat-cell *matCellDef="let row">{{ row.metric }}</td>
      </ng-container>

      <!-- Value Column -->
      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef>Value</th>
        <td mat-cell *matCellDef="let row">
          <span *ngIf="row.status === 'active'" class="status-indicator">
            <span class="status-dot active"></span>
            {{ row.value }}
          </span>
          <span *ngIf="!row.status">{{ row.value }}</span>
          <span *ngIf="row.status === 'verified'">{{ row.value }}</span>
        </td>
      </ng-container>

      <!-- Details Column -->
      <ng-container matColumnDef="details">
        <th mat-header-cell *matHeaderCellDef>Details</th>
        <td mat-cell *matCellDef="let row">{{ row.details }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
