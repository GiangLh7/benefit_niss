<div class="personal-data-container">
  <div *ngIf="isLoading" class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!isLoading" class="table-wrapper">
    <table mat-table [dataSource]="dataSource" class="personal-data-table">
      <!-- Label Column -->
      <ng-container matColumnDef="label">
        <td mat-cell *matCellDef="let row" class="label-cell">{{ row.label }}</td>
      </ng-container>

      <!-- Value Column -->
      <ng-container matColumnDef="value">
        <td mat-cell *matCellDef="let row" class="value-cell">{{ row.value }}</td>
      </ng-container>

      <!-- Rows (no header) -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
