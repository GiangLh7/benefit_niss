# ==============================================================================
# Google Cloud Build Configuration
# Builds and deploys both Benefit and Financial projects
# ==============================================================================

steps:
  # ============================================================================
  # Step 1: Build Benefit Project Docker Image
  # ============================================================================
  - name: "gcr.io/cloud-builders/docker"
    id: "build-benefit"
    args:
      - "build"
      - "-t"
      - "${_REGISTRY}/${_PROJECT_ID}/${_BENEFIT_IMAGE_NAME}:${SHORT_SHA}"
      - "-t"
      - "${_REGISTRY}/${_PROJECT_ID}/${_BENEFIT_IMAGE_NAME}:latest"
      - "-f"
      - "./benefit/Dockerfile"
      - "./benefit"
    waitFor: ["-"]

  # ============================================================================
  # Step 2: Build Financial Project Docker Image
  # ============================================================================
  - name: "gcr.io/cloud-builders/docker"
    id: "build-financial"
    args:
      - "build"
      - "-t"
      - "${_REGISTRY}/${_PROJECT_ID}/${_FINANCIAL_IMAGE_NAME}:${SHORT_SHA}"
      - "-t"
      - "${_REGISTRY}/${_PROJECT_ID}/${_FINANCIAL_IMAGE_NAME}:latest"
      - "-f"
      - "./financial/TimorINSS-MInterno/Dockerfile"
      - "./financial/TimorINSS-MInterno"
    waitFor: ["-"]

  # ============================================================================
  # Step 3: Push Benefit Image to Container Registry
  # ============================================================================
  - name: "gcr.io/cloud-builders/docker"
    id: "push-benefit"
    args:
      - "push"
      - "--all-tags"
      - "${_REGISTRY}/${_PROJECT_ID}/${_BENEFIT_IMAGE_NAME}"
    waitFor: ["build-benefit"]

  # ============================================================================
  # Step 4: Push Financial Image to Container Registry
  # ============================================================================
  - name: "gcr.io/cloud-builders/docker"
    id: "push-financial"
    args:
      - "push"
      - "--all-tags"
      - "${_REGISTRY}/${_PROJECT_ID}/${_FINANCIAL_IMAGE_NAME}"
    waitFor: ["build-financial"]

  # ============================================================================
  # Step 5: Deploy Benefit to Cloud Run (Optional)
  # Only runs if _DEPLOY_BENEFIT is set to "true"
  # ============================================================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-benefit"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_DEPLOY_BENEFIT}" = "true" ]; then
          gcloud run deploy ${_BENEFIT_SERVICE_NAME} \
            --image ${_REGISTRY}/${_PROJECT_ID}/${_BENEFIT_IMAGE_NAME}:${SHORT_SHA} \
            --region ${_REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10
        else
          echo "Skipping Benefit deployment (_DEPLOY_BENEFIT=${_DEPLOY_BENEFIT})"
        fi
    waitFor: ["push-benefit"]

  # ============================================================================
  # Step 6: Deploy Financial to Cloud Run (Optional)
  # Only runs if _DEPLOY_FINANCIAL is set to "true"
  # ============================================================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-financial"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_DEPLOY_FINANCIAL}" = "true" ]; then
          gcloud run deploy ${_FINANCIAL_SERVICE_NAME} \
            --image ${_REGISTRY}/${_PROJECT_ID}/${_FINANCIAL_IMAGE_NAME}:${SHORT_SHA} \
            --region ${_REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10
        else
          echo "Skipping Financial deployment (_DEPLOY_FINANCIAL=${_DEPLOY_FINANCIAL})"
        fi
    waitFor: ["push-financial"]

# ============================================================================
# Substitutions (Default values)
# ============================================================================
substitutions:
  # Container Registry
  _REGISTRY: "gcr.io" # or 'asia.gcr.io', 'eu.gcr.io', 'us.gcr.io'

  # Image names
  _BENEFIT_IMAGE_NAME: "benefit"
  _FINANCIAL_IMAGE_NAME: "timor-inss-minterno"

  # Cloud Run service names
  _BENEFIT_SERVICE_NAME: "benefit-app"
  _FINANCIAL_SERVICE_NAME: "financial-app"

  # Region
  _REGION: "asia-southeast1" # Change to your preferred region

  # Deployment flags (set to 'true' to enable deployment)
  _DEPLOY_BENEFIT: "false"
  _DEPLOY_FINANCIAL: "false"

# ============================================================================
# Build Options
# ============================================================================
options:
  # Machine type for build
  machineType: "E2_HIGHCPU_8" # Options: E2_HIGHCPU_8, E2_HIGHCPU_32, etc.

  # Build timeout (in seconds)
  timeout: "1800s" # 30 minutes

  # Logging
  logging: CLOUD_LOGGING_ONLY

  # Substitution variables
  substitution_option: "ALLOW_LOOSE"

# ============================================================================
# Images to be pushed to Container Registry
# ============================================================================
images:
  - "${_REGISTRY}/${_PROJECT_ID}/${_BENEFIT_IMAGE_NAME}:${SHORT_SHA}"
  - "${_REGISTRY}/${_PROJECT_ID}/${_BENEFIT_IMAGE_NAME}:latest"
  - "${_REGISTRY}/${_PROJECT_ID}/${_FINANCIAL_IMAGE_NAME}:${SHORT_SHA}"
  - "${_REGISTRY}/${_PROJECT_ID}/${_FINANCIAL_IMAGE_NAME}:latest"

# ============================================================================
# Tags (for filtering builds)
# ============================================================================
tags:
  - "benefit"
  - "financial"
  - "docker"
  - "angular"
