name: CI/CD Pipeline - Build and Deploy Both Projects

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BENEFIT: benefit
  IMAGE_NAME_FINANCIAL: timor-inss-minterno

jobs:
  # Job 1: Build Benefit Project
  build-benefit:
    name: Build Benefit Project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./benefit
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Benefit
        id: meta-benefit
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_BENEFIT }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Benefit Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./benefit
          file: ./benefit/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-benefit.outputs.tags }}
          labels: ${{ steps.meta-benefit.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 2: Build Financial Project
  build-financial:
    name: Build Financial Project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./financial/TimorINSS-MInterno
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Financial
        id: meta-financial
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_FINANCIAL }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Financial Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./financial/TimorINSS-MInterno
          file: ./financial/TimorINSS-MInterno/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-financial.outputs.tags }}
          labels: ${{ steps.meta-financial.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Deploy (Optional - customize based on your deployment target)
  deploy:
    name: Deploy Applications
    runs-on: ubuntu-latest
    needs: [build-benefit, build-financial]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Benefit Application
        run: |
          echo "Deploy Benefit application here"
          # Add your deployment commands here
          # Example: kubectl, docker-compose, ssh, etc.

      - name: Deploy Financial Application
        run: |
          echo "Deploy Financial application here"
          # Add your deployment commands here
          # Example: kubectl, docker-compose, ssh, etc.

