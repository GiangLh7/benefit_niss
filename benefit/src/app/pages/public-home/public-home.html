<div class="page">
  <header class="top-bar">
    <div class="brand">
      <div class="logo-mark" aria-hidden="true">
        <div class="sunburst"></div>
        <div class="support"></div>
      </div>
      <div class="brand-copy">
        <h1>INSS Portal - Social Security</h1>
        <span class="tagline">SEGURANÇA SOCIAL</span>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="lang-selector" aria-label="Switch language">
        EN
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <button type="button" class="login-link" (click)="goToLogin()">
        <span class="icon" aria-hidden="true">👤</span>
        <span>
          Reserved Area
          <small>Login</small>
        </span>
      </button>
    </div>
  </header>

  <main class="hero" role="main">
    <div class="hero-logo" aria-hidden="true">
      <div class="hero-sun"></div>
      <div class="hero-support"></div>
    </div>
    <p class="hero-title">SEGURANÇA SOCIAL</p>
  </main>

  <footer class="footer">
    © 2020 National Institute of Social Security - Timor-Leste
  </footer>
</div>
